<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="initial-scale=1.0, user-scalable=no" />
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
  <title>医院区域划分 - 行政区边界 Voronoi</title>
  <style type="text/css">
    html { height: 100% }
    body { height: 100%; margin: 0; padding: 0 }
    #container { height: 100% }
  </style>
  <script type="text/javascript" src="https://api.map.baidu.com/api?v=1.0&type=webgl&ak="></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/d3-delaunay@6/dist/d3-delaunay.min.js"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/polygon-clipping@0.15.7/dist/polygon-clipping.umd.min.js"></script>
</head>
<body>
  <div id="container"></div>
  <script type="text/javascript">
    // 初始化百度地图，默认定位到北京市中心附近。
    var map = new BMapGL.Map("container");
    var point = new BMapGL.Point(116.404, 39.915);
    map.centerAndZoom(point, 12);
    map.enableScrollWheelZoom(true);

    // 页面运行期间维护的地图覆盖物和医院数据。
    var hospitalMarkers = [];
    var hospitalLabels = [];
    var hospitalData = [];
    var voronoiPolygons = [];
    var boundaryPolygons = [];
    var currentRegion = "";
    var currentRegionBoundaries = null;
    var hospitalKeywords = ["医院"];
    var maxSearchPages = 5;
    var searchGridSize = 4;

    // 清理上一轮查询产生的医院点、名称标签和 Voronoi 多边形。
    function clearMarkers() {
      clearVoronoi();
      for (var i = 0; i < hospitalMarkers.length; i++)
        map.removeOverlay(hospitalMarkers[i]);
      for (var i = 0; i < hospitalLabels.length; i++)
        map.removeOverlay(hospitalLabels[i]);
      hospitalMarkers = [];
      hospitalLabels = [];
      hospitalData = [];
      currentRegionBoundaries = null;
    }

function calculateRationality() {
    // 合理性评分基于当前搜索得到的医院点和行政区边界，不再使用随机数。
    if (!hospitalData || hospitalData.length < 3) {
        alert("请先搜索并加载医院数据！");
        return;
    }

    if (!currentRegionBoundaries) {
        alert("请先搜索行政区，获取行政区边界后再计算分布合理性。");
        return;
    }

    const result = analyzeHospitalDistribution(hospitalData, currentRegionBoundaries);
    showScoreOnMap(result);

    // C++ 端会通过 runJavaScript("window.jsScoreResult") 异步读取这个值。
    window.jsScoreResult = result.totalScore.toFixed(1);
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function scoreByDistance(value, goodValue, badValue) {
    if (value <= goodValue) return 100;
    if (value >= badValue) return 0;
    return (1 - (value - goodValue) / (badValue - goodValue)) * 100;
}

function quantile(sortedValues, ratio) {
    if (!sortedValues.length) return 0;
    var index = (sortedValues.length - 1) * ratio;
    var lower = Math.floor(index);
    var upper = Math.ceil(index);
    if (lower === upper) return sortedValues[lower];
    return sortedValues[lower] * (upper - index) + sortedValues[upper] * (index - lower);
}

function getRegionCenter(boundariesLngLat) {
    var points = flattenPolygons(boundariesLngLat);
    var sumLng = 0;
    var sumLat = 0;

    for (var i = 0; i < points.length; i++) {
        sumLng += points[i][0];
        sumLat += points[i][1];
    }

    return {
        lng: sumLng / points.length,
        lat: sumLat / points.length
    };
}

function projectLngLatToMeters(lng, lat, origin) {
    var earthRadius = 6371000;
    var rad = Math.PI / 180;
    var x = (lng - origin.lng) * rad * earthRadius * Math.cos(origin.lat * rad);
    var y = (lat - origin.lat) * rad * earthRadius;
    return [x, y];
}

function polygonAreaMeters(boundariesLngLat, origin) {
    var totalArea = 0;

    for (var i = 0; i < boundariesLngLat.length; i++) {
        var meterRing = boundariesLngLat[i].map(p => projectLngLatToMeters(p[0], p[1], origin));
        var area = 0;
        for (var j = 0; j < meterRing.length; j++) {
            var next = meterRing[(j + 1) % meterRing.length];
            area += meterRing[j][0] * next[1] - next[0] * meterRing[j][1];
        }
        totalArea += Math.abs(area) / 2;
    }

    return totalArea;
}

function createRegionSamples(boundariesLngLat) {
    var extent = getBoundaryExtent(boundariesLngLat);
    var lngSpan = extent.maxLng - extent.minLng;
    var latSpan = extent.maxLat - extent.minLat;
    var rows = 24;
    var cols = Math.max(12, Math.round(rows * Math.max(lngSpan / Math.max(latSpan, 1e-9), 0.4)));
    var samples = [];

    for (var row = 0; row < rows; row++) {
        for (var col = 0; col < cols; col++) {
            var lng = extent.minLng + lngSpan * (col + 0.5) / cols;
            var lat = extent.minLat + latSpan * (row + 0.5) / rows;
            var point = [lng, lat];
            if (isPointInRegion(point, boundariesLngLat))
                samples.push(point);
        }
    }

    return samples.length > 0 ? samples : flattenPolygons(boundariesLngLat);
}

function nearestHospitalStats(samples, hospitals, origin) {
    var hospitalPoints = hospitals.map(h => projectLngLatToMeters(h.lng, h.lat, origin));
    var nearestDistances = [];
    var assignmentCounts = new Array(hospitals.length).fill(0);

    for (var i = 0; i < samples.length; i++) {
        var samplePoint = projectLngLatToMeters(samples[i][0], samples[i][1], origin);
        var bestDistance = Infinity;
        var bestIndex = -1;

        for (var j = 0; j < hospitalPoints.length; j++) {
            var dx = samplePoint[0] - hospitalPoints[j][0];
            var dy = samplePoint[1] - hospitalPoints[j][1];
            var distance = Math.sqrt(dx * dx + dy * dy);
            if (distance < bestDistance) {
                bestDistance = distance;
                bestIndex = j;
            }
        }

        if (bestIndex >= 0) {
            nearestDistances.push(bestDistance);
            assignmentCounts[bestIndex]++;
        }
    }

    nearestDistances.sort((a, b) => a - b);
    var averageDistance = nearestDistances.reduce((sum, distance) => sum + distance, 0) / nearestDistances.length;

    return {
        distances: nearestDistances,
        averageDistance: averageDistance,
        p90Distance: quantile(nearestDistances, 0.9),
        assignmentCounts: assignmentCounts
    };
}

function hospitalNearestNeighborDistances(hospitals, origin) {
    var hospitalPoints = hospitals.map(h => projectLngLatToMeters(h.lng, h.lat, origin));
    var distances = [];

    for (var i = 0; i < hospitalPoints.length; i++) {
        var bestDistance = Infinity;
        for (var j = 0; j < hospitalPoints.length; j++) {
            if (i === j) continue;
            var dx = hospitalPoints[i][0] - hospitalPoints[j][0];
            var dy = hospitalPoints[i][1] - hospitalPoints[j][1];
            bestDistance = Math.min(bestDistance, Math.sqrt(dx * dx + dy * dy));
        }
        if (Number.isFinite(bestDistance))
            distances.push(bestDistance);
    }

    return distances;
}

function coefficientOfVariation(values) {
    var activeValues = values.filter(value => value > 0);
    if (activeValues.length === 0) return 1;

    var mean = activeValues.reduce((sum, value) => sum + value, 0) / activeValues.length;
    var variance = activeValues.reduce((sum, value) => sum + Math.pow(value - mean, 2), 0) / activeValues.length;
    return mean > 0 ? Math.sqrt(variance) / mean : 1;
}

function analyzeHospitalDistribution(hospitals, boundariesLngLat) {
    var origin = getRegionCenter(boundariesLngLat);
    var areaMeters = polygonAreaMeters(boundariesLngLat, origin);
    var areaKm2 = areaMeters / 1000000;
    var samples = createRegionSamples(boundariesLngLat);
    var nearestStats = nearestHospitalStats(samples, hospitals, origin);
    var expectedSpacing = Math.sqrt(areaMeters / hospitals.length);
    var serviceRadius = clamp(expectedSpacing * 1.35, 3000, 15000);
    var coveredCount = nearestStats.distances.filter(distance => distance <= serviceRadius).length;
    var coverageRate = coveredCount / nearestStats.distances.length;

    var coverageScore = coverageRate * 100;
    var distanceScore = (
        scoreByDistance(nearestStats.averageDistance, serviceRadius * 0.6, serviceRadius * 1.8) * 0.55 +
        scoreByDistance(nearestStats.p90Distance, serviceRadius, serviceRadius * 2.5) * 0.45
    );

    var balanceCv = coefficientOfVariation(nearestStats.assignmentCounts);
    var balanceScore = clamp((1 - Math.min(balanceCv, 1.2) / 1.2) * 100, 0, 100);

    var nearestNeighborDistances = hospitalNearestNeighborDistances(hospitals, origin);
    var clusteredCount = nearestNeighborDistances.filter(distance => distance < expectedSpacing * 0.35).length;
    var clusterRate = nearestNeighborDistances.length ? clusteredCount / nearestNeighborDistances.length : 0;
    var clusteringScore = (1 - clusterRate) * 100;

    var totalScore = (
        coverageScore * 0.4 +
        distanceScore * 0.3 +
        balanceScore * 0.2 +
        clusteringScore * 0.1
    );

    return {
        totalScore: clamp(totalScore, 0, 100),
        hospitalCount: hospitals.length,
        areaKm2: areaKm2,
        serviceRadiusKm: serviceRadius / 1000,
        coverageRate: coverageRate,
        averageDistanceKm: nearestStats.averageDistance / 1000,
        p90DistanceKm: nearestStats.p90Distance / 1000,
        balanceScore: balanceScore,
        clusteringScore: clusteringScore
    };
}

function showScoreOnMap(result) {
    // 每次计算前移除旧评分卡，避免地图上叠加多个结果。
    if (window.scoreMarker) {
        map.removeOverlay(window.scoreMarker);
    }

    const score = typeof result === "number" ? result : result.totalScore;
    const hospitalCount = typeof result === "number" ? arguments[1] : result.hospitalCount;
    const color = score >= 60 ? '#2E8B57' : '#DC143C';
    const status = score >= 60 ? '分布合理' : '分布待优化';
    const detailHtml = typeof result === "number" ? "" : `
        <div style="margin-top:6px; text-align:left; line-height:1.6;">
          <div>行政区面积：${result.areaKm2.toFixed(1)} km²</div>
          <div>服务半径：${result.serviceRadiusKm.toFixed(1)} km</div>
          <div>覆盖率：${(result.coverageRate * 100).toFixed(1)}%</div>
          <div>平均最近距离：${result.averageDistanceKm.toFixed(1)} km</div>
          <div>90%距离：${result.p90DistanceKm.toFixed(1)} km</div>
          <div>均衡性：${result.balanceScore.toFixed(1)} 分</div>
        </div>
    `;

    var div = document.createElement("div");
    div.style.background = "white";
    div.style.padding = "10px 15px";
    div.style.borderRadius = "8px";
    div.style.boxShadow = "0 2px 8px rgba(0,0,0,0.2)";
    div.style.fontSize = "14px";
    div.style.textAlign = "center";

    div.innerHTML = `
        <div style="font-weight:bold; margin-bottom:5px;">医院分布合理性评分</div>
        <div style="font-size:22px; font-weight:bold; color:${color}; margin:5px 0;">${score.toFixed(1)} 分</div>
        <div>医院数量：${hospitalCount} 家</div>
        <div style="margin-top:3px; color:#666;">${status}</div>
        ${detailHtml}
    `;

    var label = new BMapGL.Label("", {
        position: map.getCenter(),
        offset: new BMapGL.Size(10, -30)
    });
    label.setContent(div);
    label.setStyle({
        border: "none",
        backgroundColor: "transparent"
    });

    map.addOverlay(label);
    window.scoreMarker = label;
}

    function createRegionBounds(boundariesLngLat) {
      var extent = getBoundaryExtent(boundariesLngLat);
      return createBoundsFromExtent(extent);
    }

    function getBoundaryExtent(boundariesLngLat) {
      var points = flattenPolygons(boundariesLngLat);
      return {
        minLng: Math.min(...points.map(p => p[0])),
        maxLng: Math.max(...points.map(p => p[0])),
        minLat: Math.min(...points.map(p => p[1])),
        maxLat: Math.max(...points.map(p => p[1]))
      };
    }

    function createBoundsFromExtent(extent) {
      return new BMapGL.Bounds(
        new BMapGL.Point(extent.minLng, extent.minLat),
        new BMapGL.Point(extent.maxLng, extent.maxLat)
      );
    }

    function createSearchBoundsList(boundariesLngLat) {
      if (!boundariesLngLat) return [null];

      var extent = getBoundaryExtent(boundariesLngLat);
      var lngStep = (extent.maxLng - extent.minLng) / searchGridSize;
      var latStep = (extent.maxLat - extent.minLat) / searchGridSize;
      var boundsList = [createBoundsFromExtent(extent)];

      for (var row = 0; row < searchGridSize; row++) {
        for (var col = 0; col < searchGridSize; col++) {
          var tile = {
            minLng: extent.minLng + col * lngStep,
            maxLng: extent.minLng + (col + 1) * lngStep,
            minLat: extent.minLat + row * latStep,
            maxLat: extent.minLat + (row + 1) * latStep
          };
          boundsList.push(createBoundsFromExtent(tile));
        }
      }

      return boundsList;
    }

    function isPointInPolygon(point, polygon) {
      var lng = point[0];
      var lat = point[1];
      var inside = false;

      for (var i = 0, j = polygon.length - 1; i < polygon.length; j = i++) {
        var xi = polygon[i][0], yi = polygon[i][1];
        var xj = polygon[j][0], yj = polygon[j][1];
        var intersects = ((yi > lat) !== (yj > lat))
          && (lng < (xj - xi) * (lat - yi) / ((yj - yi) || 1e-12) + xi);
        if (intersects) inside = !inside;
      }

      return inside;
    }

    function isPointInRegion(point, boundariesLngLat) {
      if (!boundariesLngLat) return true;
      return boundariesLngLat.some(boundary => isPointInPolygon(point, boundary));
    }

    function isHospitalPoi(poi) {
      var text = [poi.title, poi.address, poi.tags].filter(Boolean).join(" ");
      var title = poi.title || "";
      var excludeWords = [
        "卫生院", "卫生服务中心", "社区卫生服务中心", "卫生室", "服务站",
        "宠物医院", "动物医院", "兽医", "体检", "保健科", "预防接种",
        "门诊", "诊所", "药房", "疾控"
      ];

      return title.indexOf("医院") !== -1
        && !excludeWords.some(word => text.indexOf(word) !== -1);
    }

    function collectPois(results, boundariesLngLat) {
      var pois = [];
      var count = results && typeof results.getCurrentNumPois === "function"
        ? results.getCurrentNumPois()
        : 0;

      for (var i = 0; i < count; i++) {
        var poi = results.getPoi(i);
        if (!poi || !poi.point) continue;

        var point = [poi.point.lng, poi.point.lat];
        if (!isPointInRegion(point, boundariesLngLat)) continue;
        if (!isHospitalPoi(poi)) continue;

        pois.push(poi);
      }

      return pois;
    }

    function dedupePois(pois) {
      var seen = {};
      var result = [];

      for (var i = 0; i < pois.length; i++) {
        var poi = pois[i];
        var key = [
          poi.title || "",
          poi.address || "",
          poi.point.lng.toFixed(6),
          poi.point.lat.toFixed(6)
        ].join("|");

        if (seen[key]) continue;
        seen[key] = true;
        result.push(poi);
      }

      return result;
    }

    function searchKeywordPages(region, keyword, boundariesLngLat, searchBounds) {
      return new Promise(resolve => {
        var collected = [];
        var visitedPages = {};
        var firstPageIndex = null;
        var searchLocation = searchBounds ? map : region;

        var local = new BMapGL.LocalSearch(searchLocation, {
          pageCapacity: 100,
          onSearchComplete: function (results) {
            if (local.getStatus() !== BMAP_STATUS_SUCCESS || !results)
              return resolve(collected);

            collected = collected.concat(collectPois(results, boundariesLngLat));

            var pageIndex = typeof results.getPageIndex === "function" ? results.getPageIndex() : 0;
            var pageCount = typeof results.getNumPages === "function" ? results.getNumPages() : 1;
            if (firstPageIndex === null) firstPageIndex = pageIndex;

            var nextPage = pageIndex + 1;
            var hasNext = firstPageIndex === 0 ? nextPage < pageCount : nextPage <= pageCount;
            if (hasNext && nextPage < maxSearchPages && !visitedPages[nextPage]) {
              visitedPages[nextPage] = true;
              local.gotoPage(nextPage);
              return;
            }

            resolve(collected);
          }
        });

        if (typeof local.setPageCapacity === "function")
          local.setPageCapacity(100);

        if (searchBounds && typeof local.searchInBounds === "function") {
          local.searchInBounds(keyword, searchBounds);
        } else {
          local.search(keyword);
        }
      });
    }

    async function searchAllHospitalPois(region, boundariesLngLat) {
      var allPois = [];
      var searchBoundsList = createSearchBoundsList(boundariesLngLat);

      for (var i = 0; i < hospitalKeywords.length; i++) {
        for (var j = 0; j < searchBoundsList.length; j++) {
          var pois = await searchKeywordPages(region, hospitalKeywords[i], boundariesLngLat, searchBoundsList[j]);
          allPois = allPois.concat(pois);
        }
      }

      return dedupePois(allPois);
    }

    function renderHospitals(pois) {
      if (pois.length > 0)
        map.setViewport(pois.map(p => p.point));

      for (var i = 0; i < pois.length; i++) {
        (function (poi) {
          hospitalData.push({
            name: poi.title,
            address: poi.address,
            lat: poi.point.lat,
            lng: poi.point.lng
          });

          var marker = new BMapGL.Marker(poi.point);
          map.addOverlay(marker);
          hospitalMarkers.push(marker);

          // 点击医院标记时显示名称和地址。
          marker.addEventListener("click", function () {
            var win = new BMapGL.InfoWindow(
              "<b>" + poi.title + "</b><br/>地址: " + (poi.address || "未知"),
              { width: 260, title: "医院详情" }
            );
            map.openInfoWindow(win, poi.point);
          });

          var label = new BMapGL.Label(poi.title, {
            position: poi.point,
            offset: new BMapGL.Size(20, -10)
          });
          label.setStyle({
            color: "#333", fontSize: "12px",
            backgroundColor: "rgba(255,255,255,0.9)",
            border: "1px solid #999", padding: "2px 6px"
          });
          map.addOverlay(label);
          hospitalLabels.push(label);
        })(pois[i]);
      }
    }

    async function searchHospitals(region) {
      // 每次搜索都从干净状态开始，并记录当前行政区供边界查询使用。
      clearMarkers();
      currentRegion = region;
      window.jsScoreResult = "";

      var boundaries = await getRegionBoundaries(region);
      currentRegionBoundaries = boundaries || null;
      if (boundaries) {
        var boundaryPoints = flattenPolygons(boundaries).map(p => new BMapGL.Point(p[0], p[1]));
        map.setViewport(boundaryPoints);
      }

      var pois = await searchAllHospitalPois(region, boundaries);
      renderHospitals(pois);

      window.lastHospitalSearchInfo = {
        region: region,
        boundaryCount: boundaries ? boundaries.length : 0,
        hospitalCount: hospitalData.length
      };

      if (hospitalData.length === 0)
        alert("没有搜索到医院，请尝试输入更完整的行政区名称。");
    }

    // 经纬度转 Web Mercator 平面坐标，便于 D3 计算 Voronoi。
    function mercatorForward(lng, lat) {
      var x = lng * 20037508.34 / 180;
      var latRad = lat * Math.PI / 180;
      var y = Math.log(Math.tan(Math.PI / 4 + latRad / 2)) * 20037508.34 / Math.PI;
      return [x, y];
    }

    // Web Mercator 平面坐标转回经纬度，用于绘制百度地图多边形。
    function mercatorInverse(x, y) {
      var lng = x * 180 / 20037508.34;
      var lat = (2 * Math.atan(Math.exp(y * Math.PI / 20037508.34)) - Math.PI / 2) * 180 / Math.PI;
      return { lng: lng, lat: lat };
    }

    // 为每个 Voronoi 单元生成不同色相，方便区分医院服务区域。
    function generateColors(count) {
      var colors = [];
      for (var i = 0; i < count; i++)
        colors.push("hsl(" + (i * 360 / count) + ",70%,60%)");
      return colors;
    }

    // 清理地图上的 Voronoi 多边形。
    function clearVoronoi() {
      voronoiPolygons.forEach(p => map.removeOverlay(p));
      boundaryPolygons.forEach(p => map.removeOverlay(p));
      voronoiPolygons = [];
      boundaryPolygons = [];
    }

    function bringHospitalOverlaysToFront() {
      // 重新添加医院标记和文字标签，让它们显示在彩色区域上方。
      hospitalMarkers.forEach(marker => {
        map.removeOverlay(marker);
        map.addOverlay(marker);
      });
      hospitalLabels.forEach(label => {
        map.removeOverlay(label);
        map.addOverlay(label);
      });
    }

    function parseBaiduBoundary(boundary) {
      // BMapGL.Boundary 返回的边界通常是 "lng,lat;lng,lat;..." 字符串。
      if (Array.isArray(boundary)) {
        var arrayPoints = boundary.map(point => {
          if (Array.isArray(point) && point.length >= 2)
            return [Number(point[0]), Number(point[1])];
          if (point && Number.isFinite(point.lng) && Number.isFinite(point.lat))
            return [point.lng, point.lat];
          return null;
        }).filter(Boolean);

        return arrayPoints.length >= 3 ? arrayPoints : null;
      }

      var points = String(boundary).split(";").map(item => {
        var pair = item.split(",").map(Number);
        return pair.length >= 2 && Number.isFinite(pair[0]) && Number.isFinite(pair[1])
          ? [pair[0], pair[1]]
          : null;
      }).filter(Boolean);

      return points.length >= 3 ? points : null;
    }

    function getRegionBoundaries(region) {
      // 使用百度 BMapGL.Boundary 读取行政区边界，和医院 POI 坐标保持同一套百度坐标系。
      return new Promise(resolve => {
        try {
          var boundarySearch = new BMapGL.Boundary();
          boundarySearch.get(region, function (result) {
            if (!result || !result.boundaries || result.boundaries.length === 0)
              return resolve(null);

            var boundaries = result.boundaries
              .map(parseBaiduBoundary)
              .filter(Boolean);

            resolve(boundaries.length > 0 ? boundaries : null);
          });
        } catch (error) {
          resolve(null);
        }
      });
    }

    function closeRing(points) {
      if (!points || points.length < 3) return null;

      var ring = points.filter(p =>
        p && Number.isFinite(p[0]) && Number.isFinite(p[1])
      );
      if (ring.length < 3) return null;

      var first = ring[0];
      var last = ring[ring.length - 1];
      if (Math.abs(first[0] - last[0]) > 1e-9 || Math.abs(first[1] - last[1]) > 1e-9)
        ring = ring.concat([[first[0], first[1]]]);

      return ring.length >= 4 ? ring : null;
    }

    function flattenPolygons(polygons) {
      var points = [];
      for (var i = 0; i < polygons.length; i++) {
        for (var j = 0; j < polygons[i].length; j++) {
          points.push(polygons[i][j]);
        }
      }
      return points;
    }

    function drawRegionBoundaries(boundariesLngLat) {
      if (!boundariesLngLat) return;

      for (var i = 0; i < boundariesLngLat.length; i++) {
        var path = boundariesLngLat[i].map(p => new BMapGL.Point(p[0], p[1]));
        var boundary = new BMapGL.Polygon(path, {
          strokeColor: "#222",
          strokeWeight: 3,
          strokeOpacity: 1,
          fillColor: "#ffffff",
          fillOpacity: 0
        });
        map.addOverlay(boundary);
        boundaryPolygons.push(boundary);
      }
    }

    function clipCellWithBoundaries(cellRing, mercBounds) {
      // 行政区经常是凹多边形，使用 polygon-clipping 做可靠的多边形相交。
      if (!mercBounds || !window.polygonClipping) return [];

      var clippedRings = [];
      for (var i = 0; i < mercBounds.length; i++) {
        try {
          var result = polygonClipping.intersection([cellRing], [mercBounds[i]]);
          for (var j = 0; j < result.length; j++) {
            var outerRing = result[j][0];
            if (outerRing && outerRing.length >= 4)
              clippedRings.push(outerRing);
          }
        } catch (error) {
          return [];
        }
      }
      return clippedRings;
    }

    function drawVoronoiCells(boundariesLngLat) {
      if (!boundariesLngLat) return 0;

      // D3 Voronoi 在平面坐标下计算，边界和医院点都先转成 Mercator。
      var points = hospitalData.map(h => [h.lng, h.lat]);
      var mercPoints = points.map(p => mercatorForward(p[0], p[1]));
      var mercBounds = boundariesLngLat.map(boundary =>
        closeRing(boundary.map(p => mercatorForward(p[0], p[1])))
      ).filter(Boolean);
      if (mercBounds.length === 0) return 0;

      // Voronoi 外框使用行政区范围，最后再与行政区轮廓相交。
      var rangePoints = flattenPolygons(mercBounds);
      var minX = Math.min(...rangePoints.map(p => p[0]));
      var maxX = Math.max(...rangePoints.map(p => p[0]));
      var minY = Math.min(...rangePoints.map(p => p[1]));
      var maxY = Math.max(...rangePoints.map(p => p[1]));
      var padding = 1000;
      var del = d3.Delaunay.from(mercPoints);
      var vor = del.voronoi([minX - padding, minY - padding, maxX + padding, maxY + padding]);

      var colors = generateColors(hospitalData.length);
      var drawnCount = 0;
      for (var i = 0; i < hospitalData.length; i++) {
        var cell = vor.cellPolygon(i);
        if (!cell) continue;

        var cellRing = closeRing(cell);
        if (!cellRing) continue;

        var clippedCells = clipCellWithBoundaries(cellRing, mercBounds);

        for (var j = 0; j < clippedCells.length; j++) {
          // 将裁剪后的 Mercator 坐标转回经纬度并绘制到百度地图。
          var path = clippedCells[j].map(c => {
            var ll = mercatorInverse(c[0], c[1]);
            return new BMapGL.Point(ll.lng, ll.lat);
          });

          var poly = new BMapGL.Polygon(path, {
            strokeColor: colors[i], strokeWeight: 2, strokeOpacity: 0.95,
            fillColor: colors[i], fillOpacity: 0.36
          });
          map.addOverlay(poly);
          voronoiPolygons.push(poly);
          drawnCount++;
        }
      }

      return drawnCount;
    }

    function computeVoronoiClipped(boundariesLngLat) {
      if (!boundariesLngLat) return "no-boundary";

      var drawnCount = drawVoronoiCells(boundariesLngLat);
      if (drawnCount > 0) {
        drawRegionBoundaries(boundariesLngLat);
        return "clipped";
      }

      // 不再退回到医院点位外框，避免出现矩形 Voronoi；只保留行政区轮廓提示。
      drawRegionBoundaries(boundariesLngLat);
      return "failed";
    }

    async function runVoronoiAnalysis() {
      // 少于 3 个点无法构成有效的 Voronoi 区域。
      if (hospitalData.length < 3)
        return alert("至少需要3个医院");
      clearVoronoi();
      var bounds = currentRegionBoundaries || (currentRegion ? await getRegionBoundaries(currentRegion) : null);
      currentRegionBoundaries = bounds || null;
      var status = computeVoronoiClipped(bounds);
      bringHospitalOverlaysToFront();
      if (status === "clipped")
        alert("百度行政区裁剪 Voronoi 生成完成！");
      else if (status === "no-boundary")
        alert("未读取到百度行政区边界，无法按行政区轮廓生成 Voronoi。");
      else
        alert("行政区轮廓裁剪失败，未生成矩形 Voronoi。");
    }

    // 不再自动搜索，避免程序启动时消耗地图检索额度。
  </script>
</body>
</html>
